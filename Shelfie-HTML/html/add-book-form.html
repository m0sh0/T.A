<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a book</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/add-book-form.css">
</head>
<body>
    <main>
        <h1 class="title">Add a book</h1>
        <form id="book-form">
            <label for="title">Title:</label>
            <input id="title" type="text" placeholder="Book title" required />

            <label for="author">Author:</label>
            <input id="author" type="text" placeholder="Author" required />

            <label for="pages">Number of pages:</label>
            <input id="pages" type="number" min="1" step="1" placeholder="Number of pages" required />

            <label for="status">Status:</label>
            <select id="status">
                <option value="Reading">Reading</option>
                <option value="To Read">Want to Read</option>
                <option value="Already Read">Already Read</option>
            </select>

            <label for="cover">Book Cover (optional)</label>
            <input id="cover" type="file" accept="image/*" />
            <img id="cover-preview" alt="Cover preview" />

            <button type="submit">Save Book</button>
        </form>
    </main>
    <script src="../js/add-book.js"></script>
</body>
</html>
